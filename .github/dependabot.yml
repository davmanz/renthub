version: 2
updates:
  # Enable version updates for Python packages
  - package-ecosystem: "pip"
    directory: "/renthub-backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "backend"
    
  # Enable version updates for npm packages
  - package-ecosystem: "npm"
    directory: "/renthub-frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "frontend"
    
  # Enable version updates for Docker
  - package-ecosystem: "docker"
    directory: "/renthub-backend"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
    
  - package-ecosystem: "docker"
    directory: "/renthub-frontend"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
    
  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
